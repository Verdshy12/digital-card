<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mash Martin Portfolio</title>
    <style>
        /* General Page Layout */
        body {
            background-color: #1a1a1a; /* Dark background to see the glow */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 1. The Main Heading */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Container for the 3 Boxes */
        .roles-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Allows stacking on mobile screens */
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Shared Style for the Glowing Boxes */
        .glow-box {
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 2px solid;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: default;
            transition: transform 0.3s ease;
        }

        .glow-box:hover {
            transform: translateY(-5px); /* Moves up slightly on hover */
        }

        /* --- Specific Colors and Glow Animations --- */

        /* Box 1: Digital Media Strategist (Cyan) */
        .box-1 {
            color: #00f2ff;
            border-color: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
            animation: glow-cyan 2s infinite alternate;
        }

        /* Box 2: Social Media Manager (Magenta) */
        .box-2 {
            color: #ff00ff;
            border-color: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            animation: glow-magenta 2s infinite alternate;
        }

        /* Box 3: PR Manager & Marketer (Lime Green) */
        .box-3 {
            color: #ccff00;
            border-color: #ccff00;
            box-shadow: 0 0 10px #ccff00;
            animation: glow-lime 2s infinite alternate;
        }

        /* --- Keyframes for the Pulsing Glow Effect --- */
        @keyframes glow-cyan {
            from { box-shadow: 0 0 5px #00f2ff, 0 0 10px #00f2ff; }
            to { box-shadow: 0 0 20px #00f2ff, 0 0 30px #00f2ff; }
        }
        @keyframes glow-magenta {
            from { box-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff; }
            to { box-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff; }
        }
        @keyframes glow-lime {
            from { box-shadow: 0 0 5px #ccff00, 0 0 10px #ccff00; }
            to { box-shadow: 0 0 20px #ccff00, 0 0 30px #ccff00; }
        }

        /* --- Bottom Section: Arrows and Name --- */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arrows {
            font-size: 3rem;
            color: white;
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        .name-box {
            border: 2px solid white;
            padding: 15px 40px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>What I Am</h1>

    <div class="roles-container">
        <div class="glow-box box-1">Digital Media Strategist</div>
        <div class="glow-box box-2">Social Media Manager</div>
        <div class="glow-box box-3">PR Manager and Marketer</div>
    </div>

    <div class="bottom-section">
        <div class="arrows">
            <span>&#8595;</span> <span>&#8595;</span>
            <span>&#8595;</span>
        </div>
        <div class="name-box">
            Mash Martin
        </div>
    </div>

</body>
</html>
